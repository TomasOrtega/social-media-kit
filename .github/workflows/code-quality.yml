name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  typescript-check:
    name: TypeScript Compilation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check TypeScript compilation
      run: npm run type-check
      continue-on-error: true
      
    - name: Check for TypeScript errors in tests  
      run: npm run type-check
      continue-on-error: true

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint -- --max-warnings 0
      continue-on-error: true
      
    - name: Check Prettier formatting
      run: npm run format:check
      continue-on-error: true

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build TypeScript
      run: npm run type-check
      
    - name: Build with Vite
      run: npm run build
      
    - name: Check bundle size
      run: |
        BUNDLE_SIZE=$(du -sk dist/ | cut -f1)
        echo "Bundle size: ${BUNDLE_SIZE}KB"
        
        # Alert if bundle size exceeds 1MB (1024KB)
        if [ $BUNDLE_SIZE -gt 1024 ]; then
          echo "⚠️  Bundle size is large: ${BUNDLE_SIZE}KB"
        else
          echo "✅ Bundle size is reasonable: ${BUNDLE_SIZE}KB"
        fi
        
    - name: Verify essential files exist
      run: |
        test -f dist/index.html || (echo "Missing index.html" && exit 1)
        test -f dist/assets/*.js || (echo "Missing JavaScript bundle" && exit 1)
        test -f dist/assets/*.css || (echo "Missing CSS bundle" && exit 1)
        echo "✅ All essential build files present"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Audit for vulnerabilities
      run: npm audit --audit-level=moderate
      
    - name: Check for outdated packages
      run: npm outdated || true
